<div class="container mt-4">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h2 class="h4 mb-0">{{ isEditMode ? 'Modifier' : 'Ajouter' }} une équipe</h2>
      </div>
      
      <div class="card-body">
        <form [formGroup]="equipeForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="nomEquipe" class="form-label">Nom de l'équipe</label>
            <input type="text" class="form-control" id="nomEquipe" formControlName="nomEquipe">
          </div>
          
          <div class="mb-3">
            <label for="niveau" class="form-label">Niveau</label>
            <select class="form-select" id="niveau" formControlName="niveau">
              <option value="JUNIOR">Junior</option>
              <option value="SENIOR">Senior</option>
              <option value="EXPERT">Expert</option>
            </select>
          </div>
          
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" routerLink="/equipes">Annuler</button>
            <button type="submit" class="btn btn-primary" [disabled]="!equipeForm.valid">
              {{ isEditMode ? 'Modifier' : 'Ajouter' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
